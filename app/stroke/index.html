<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뇌졸중 예측 실습실 · 11·12차시</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.4.0/build/stlite.css" />
  <style>
    #loading { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; padding: 56px 24px; text-align: center; color: #3a2e1a; }
    #loading h2 { margin: 0 0 10px; font-size: 22px; }
    #loading p { margin: 4px 0; color: #6b5d45; font-size: 15px; }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <h2>🩺 뇌졸중 예측 실습실</h2>
      <p>브라우저 안에서 파이썬을 준비하고 있습니다.</p>
      <p>처음 열 때 30초에서 1분쯤 걸립니다.</p>
    </div>
  </div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.4.0/build/stlite.js";
    mount(
      {
        requirements: ["pandas", "plotly", "scikit-learn"],
        entrypoint: "main.py",
        streamlitConfig: { "theme.base": "light" },
        // 학생이 적은 내용을 이 폴더에 파일로 남긴다. 브라우저 저장소(IndexedDB)에 보관되어 새로고침해도 남는다
        idbfsMountpoints: ["/home/pyodide/내_기록"],
        files: {
          "main.py": { url: "./main.py?v=2" },
          "pages/1_탐색.py": { url: "./pages/1_%ED%83%90%EC%83%89.py" },
          "pages/2_분류_모델.py": { url: "./pages/2_%EB%B6%84%EB%A5%98_%EB%AA%A8%EB%8D%B8.py" },
          "pages/3_채점표.py": { url: "./pages/3_%EC%B1%84%EC%A0%90%ED%91%9C.py" },
          "pages/4_성능_높이기.py": { url: "./pages/4_%EC%84%B1%EB%8A%A5_%EB%86%92%EC%9D%B4%EA%B8%B0.py?v=2" },
          "pages/5_내가_만든_모델_소개.py": { url: "./pages/5_%EB%82%B4%EA%B0%80_%EB%A7%8C%EB%93%A0_%EB%AA%A8%EB%8D%B8_%EC%86%8C%EA%B0%9C.py?v=3" },
        },
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
